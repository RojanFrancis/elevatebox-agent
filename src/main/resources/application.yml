# Committed on purpose: it only maps environment variables to settings, so the same file works
# on a laptop, in CI and on Render. Never put a secret in this file. Values come from the
# environment (see .env.example). For personal overrides use application-local.yml, which is git-ignored.
server:
  port: ${PORT:8081}

spring:
  application:
    name: elevatebox-agent
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/elevatebox;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  codec:
    max-in-memory-size: 10MB

app:
  api-key: ${APP_API_KEY}                  # callers send this as X-API-Key

vapi:
  private-key: ${VAPI_PRIVATE_KEY}
  phone-number-id: ${VAPI_PHONE_NUMBER_ID} # Vapi dashboard -> Phone Numbers -> ID
  assistant-id: ${VAPI_ASSISTANT_ID:}      # optional; blank uses the inline assistant
  target-phone: ${VAPI_TARGET_PHONE}       # E.164, the number the agent dials
  webhook-secret: ${VAPI_WEBHOOK_SECRET}   # same value as the Vapi Server URL credential
  max-call-seconds: ${VAPI_MAX_CALL_SECONDS:180}  # hard limit on every outbound call

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.6-flash}   # change without recompiling
  fallback-models: ${GEMINI_FALLBACK_MODELS:}   # comma-separated, tried in order if the main model fails

meta:
  whatsapp:
    token: ${META_WHATSAPP_TOKEN}
    phone-number-id: ${META_PHONE_NUMBER_ID}
    target-phone: ${WHATSAPP_TARGET_PHONE}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}   # any random string; also entered in Meta's webhook settings
    app-secret: ${META_APP_SECRET:}           # Meta app -> App settings -> Basic; signs incoming webhooks

agent:
  name: ${AGENT_NAME:Rojan Francis}
  phone: ${AGENT_PHONE}                    # shown in the post-call WhatsApp; no default on purpose
  resume-link: ${AGENT_RESUME_LINK:https://github.com/RojanFrancis}
  build-image-url: ${AGENT_BUILD_IMAGE_URL:https://github.com/RojanFrancis/elevatebox-agent}
  brochure-url: ${AGENT_BROCHURE_URL:https://github.com/RojanFrancis/elevatebox-agent}  # link sent in the mid-call WhatsApp
  keyword-mid-call: ${AGENT_KEYWORD_MID_CALL:false}  # true: also trigger the mid-call WhatsApp from keywords, for assistants without the send_whatsapp tool

optin:
  cooldown-hours: ${OPTIN_COOLDOWN_HOURS:24}   # call each number at most once per this many hours
  calls-per-day: ${OPTIN_CALLS_PER_DAY:20}     # opt-in calls across everyone per UTC day

demo:
  max-chars: ${DEMO_MAX_CHARS:4000}
  per-minute: ${DEMO_PER_MINUTE:5}
  per-day: ${DEMO_PER_DAY:30}
  global-per-day: ${DEMO_GLOBAL_PER_DAY:150}

logging:
  level:
    com.elevatebox: INFO
